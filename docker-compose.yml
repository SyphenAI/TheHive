# Default: plain HTTP on loopback only. For TLS, also pass -f docker-compose.tls.yml (see README).
services:
  thehive:
    build: .
    image: thehive:local
    container_name: thehive
    ports:
      - "127.0.0.1:50090:50090"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      STORAGE_DIR: /app/storage
      REGISTRY_PATH: /app/registry/providers.json
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./registry:/app/registry:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
